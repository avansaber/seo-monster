[project]
name = "seomonster-workbench"
version = "0.6.0"
description = "Evidence-first, local decision workbench for SEOmonster"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AvanSaber Inc." }]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=2.3.0,<3", "jsonschema>=4.20,<5", "pydantic>=2.12,<3", "uvicorn>=0.31.1,<1"]
test = ["pytest>=7", "httpx>=0.27,<1", "httpx2>=2.10.0"]
dev = ["pytest>=7", "httpx>=0.27,<1", "httpx2>=2.10.0", "ruff>=0.15,<0.16"]

[project.scripts]
seomonster-workbench = "seomonster_workbench.cli:main"
sm-workbench = "seomonster_workbench.cli:main"
sm-workbench-mcp = "seomonster_workbench.mcp_server:main"
sm-workbench-capture = "seomonster_workbench.capture:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seomonster_workbench"]

[tool.hatch.build.targets.sdist]
exclude = ["/docs/IMPLEMENTATION_REPORT.md"]
include = ["/src", "/tests", "/schemas", "/evaluation", "/plugins", "/examples", "/scripts", "/docs", "/README.md", "/CHANGELOG.md", "/LICENSE", "/pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120
