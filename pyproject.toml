[project]
# SEOMonster. Published on PyPI as "seo-monster"; the import package stays
# "seo_mcp". The earlier "seo-monster-mcp 0.1.0" release was renamed to drop
# the redundant -mcp suffix in favor of the cleaner brand name.
name = "seo-monster"
version = "0.11.0"
description = "SEOMonster: an MCP server for SEO workflows over Google Search Console, GA4, PageSpeed Insights, and Cloudflare. User-credential-driven, read-first."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "AvanSaber Inc.", email = "support@avansaber.com" }]
requires-python = ">=3.11"
keywords = ["seo", "seomonster", "mcp", "search-console", "ga4", "pagespeed", "cloudflare", "ai", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
    "mcp>=2.3.0,<3",
    "jsonschema>=4.20,<5",
    "google-api-python-client>=2.0.0",
    "google-auth>=2.0.0",
    "google-auth-oauthlib>=1.0.0",
    "google-analytics-data>=0.18.0",
    # Security floors for transitive runtime dependencies. Installers keep an existing
    # version that still satisfies the requirements, so these floors are what move a
    # reused environment past the known affected ranges; the lock alone cannot.
    # Each floor is the highest first-patched release across the GitHub advisories
    # replayed in tests/test_dependency_advisories.py.
    "anyio>=4.14.2",
    "certifi>=2026.10.18",
    "cryptography>=50.0.0",
    "httplib2>=0.32.0",
    "oauthlib>=4.0.1",
    "pyasn1>=0.6.5",
    "pyjwt>=2.15.0",
    "python-multipart>=0.0.31",
    "starlette>=1.3.1",
    "urllib3>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "packaging>=24",  # scripts/check_dependency_advisories.py
    "ruff>=0.17,<0.18",
]

[project.scripts]
# Primary command matches the PyPI name so `uvx seo-monster` just works.
# `seo-mcp` is kept as a convenience alias for local/dev use.
seo-monster = "seo_mcp.server:main"
seo-mcp = "seo_mcp.server:main"

[project.urls]
Homepage = "https://www.avansaber.com/seomonster/"
Documentation = "https://www.avansaber.com/seomonster/docs/"
Repository = "https://github.com/avansaber/seo-monster"
Issues = "https://github.com/avansaber/seo-monster/issues"

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seo_mcp"]
# The root .gitignore re-includes these JSON names at any depth; only the
# tracked root copies belong in a build.
exclude = ["*/**/.mcp.json", "*/**/manifest.json", "*/**/package.json", "*/**/server.json"]

# Defense in depth: the source archive is an explicit allowlist, so local
# tool folders, build output and private notes in a working tree are never
# swept in. The exclusions below still apply inside allowed paths. The CI
# workflow builds from a deliberately dirty tree and checks the inventory;
# the release workflow refuses tracked coordination files.
[tool.hatch.build.targets.sdist]
only-include = [
  ".cursor-plugin/plugin.json",
  ".github",
  ".gitignore",
  ".mcp.json",
  ".mcpbignore",
  "assets",
  "CHANGELOG.md",
  "CONTRIBUTING.md",
  "DESIGN.md",
  "LICENSE",
  "llms-install.md",
  "manifest.json",
  "PRIVACY.md",
  "pyproject.toml",
  "README.md",
  "scripts",
  "server.json",
  "src",
  "tests",
  "uv.lock",
]
exclude = [
  "*/**/.mcp.json",
  "*/**/manifest.json",
  "*/**/package.json",
  "*/**/server.json",
  "RESEARCH-AND-PROPOSAL.md",
  "PART1_VALIDATION.md",
  "LISTINGS-PLAN.md",
  "PLAN.md",
  "CLAUDE.md",
  "HANDOFF.md",
  "marketing/",
  "marketing/**",
  ".private/",
  ".private/**",
  ".env",
  ".env.*",
  "20??-??-??-*.txt",
  "archive/",
  "archive/**",
  "companion/",
  "companion/**",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[tool.ruff]
required-version = ">=0.17,<0.18"
