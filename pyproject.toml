[project]
# SEOMonster. Published on PyPI as "seo-monster"; the import package stays
# "seo_mcp". The earlier "seo-monster-mcp 0.1.0" release was renamed to drop
# the redundant -mcp suffix in favor of the cleaner brand name.
name = "seo-monster"
version = "0.4.0"
description = "SEOMonster: an MCP server for SEO workflows over Google Search Console, GA4, PageSpeed Insights, and Cloudflare. User-credential-driven, read-first."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "AvanSaber Inc.", email = "support@avansaber.com" }]
requires-python = ">=3.11"
keywords = ["seo", "seomonster", "mcp", "search-console", "ga4", "pagespeed", "cloudflare", "ai", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
    "mcp>=1.0.0",
    "google-api-python-client>=2.0.0",
    "google-auth>=2.0.0",
    "google-auth-oauthlib>=1.0.0",
    "google-analytics-data>=0.18.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
# Primary command matches the PyPI name so `uvx seo-monster` just works.
# `seo-mcp` is kept as a convenience alias for local/dev use.
seo-monster = "seo_mcp.server:main"
seo-mcp = "seo_mcp.server:main"

[project.urls]
Homepage = "https://seomonster.avansaber.com"
Documentation = "https://seomonster.avansaber.com"
Repository = "https://github.com/avansaber/seo-monster"
Issues = "https://github.com/avansaber/seo-monster/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seo_mcp"]

# Defense in depth: even if an internal planning doc accidentally lands in
# the working tree, hatchling's sdist target excludes it. The CI workflow
# (.github/workflows/release.yml) additionally fails any tag push that has
# these filenames tracked. The .gitignore is the first line of defense.
[tool.hatch.build.targets.sdist]
exclude = [
  "RESEARCH-AND-PROPOSAL.md",
  "LISTINGS-PLAN.md",
  "PLAN.md",
  "marketing/",
  ".private/",
  ".env",
  ".env.*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
