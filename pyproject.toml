[project]
name = "seo-mcp"
version = "0.1.0"
description = "MCP server for SEO workflows over Google Search Console, GA4, PageSpeed Insights, and Cloudflare. User-credential-driven, read-first."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "AvanSaber Inc.", email = "support@avansaber.com" }]
requires-python = ">=3.11"
keywords = ["seo", "mcp", "search-console", "ga4", "pagespeed", "cloudflare", "ai", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
    "mcp>=1.0.0",
    "google-api-python-client>=2.0.0",
    "google-auth>=2.0.0",
    "google-auth-oauthlib>=1.0.0",
    "google-analytics-data>=0.18.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
seo-mcp = "seo_mcp.server:main"

[project.urls]
Homepage = "https://github.com/avansaber/seo-mcp"
Repository = "https://github.com/avansaber/seo-mcp"
Issues = "https://github.com/avansaber/seo-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seo_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
