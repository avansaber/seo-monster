name: CI

# Lightweight push / PR gate: run the offline test suite and the ruff linter.
# The tag-driven release workflow (release.yml) re-runs the tests before it
# publishes, but this catches regressions and lint drift at PR/push time so
# they never reach a tag. No secrets, no network: the suite is fully mocked.

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']   # release.yml owns tag pushes; don't double-run there
  pull_request:
  # mcp 2.0.0 (2026-07-28) broke the published package and nobody noticed for a
  # month, because CI only fires on push and there were no pushes for 69 days.
  #
  # Note what this schedule does and does not buy. The `test` job runs
  # `uv run pytest`, which syncs from uv.lock first -- so it exercises the
  # LOCKED mcp, not whatever the ecosystem has moved to. On its own this cron
  # would therefore have stayed green through the 2.x break indefinitely. The
  # control that actually detects this particular drift is the mcp-canary job
  # below -- Dependabot deliberately ignores mcp majors (see dependabot.yml),
  # and pyproject pins <2 anyway, so neither can surface a 2.x break. The cron
  # only ensures the canary runs without waiting for someone to push.
  #
  # NOTE: GitHub disables scheduled workflows after 60 days of repository
  # inactivity, so this schedule is best-effort. Dependabot
  # (.github/dependabot.yml) is what keeps the repo active enough for it to
  # survive -- that, rather than detecting mcp drift, is the role it plays here.
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  # Match release.yml: opt the pinned JS actions onto Node 24 ahead of the
  # 2026-06-16 cutover that removes the deprecated Node 20 runtime.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Python 3.11 + project deps (dev extras for pytest)
        run: |
          uv python install 3.11
          uv venv
          uv pip install -e ".[dev]"

      - name: Lint (ruff)
        run: uv run ruff check src/ tests/

      - name: Test (offline suite)
        run: uv run pytest -q

  # Early-warning leg: install the newest mcp regardless of our pin and run the
  # suite against it. Allowed to fail -- it exists to tell us when the pin is
  # ready to be lifted, not to block PRs. Flag rationale is on the install step
  # below.
  mcp-canary:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Python 3.11 + project deps
        run: |
          uv python install 3.11
          uv venv
          uv pip install -e ".[dev]"

      - name: Force the newest mcp, ignoring our pin
        # Deliberately NOT --no-deps: mcp 2.x introduces new requirements
        # (mcp-types, httpx2, ...), and skipping them makes the suite die with
        # ModuleNotFoundError while silently skipping 12 tests -- which hides
        # the actual incompatibility behind a packaging artifact. Installing
        # deps properly surfaces the real signal: 11 failures with
        # `AttributeError: 'Server' object has no attribute 'list_tools'`.
        # --refresh defeats the setup-uv cache.
        run: uv pip install --upgrade --refresh "mcp>=2"

      # --no-sync is load-bearing on both commands. Plain `uv run` re-syncs the
      # environment from uv.lock before executing, which silently reinstalls
      # the pinned mcp and reverts the upgrade above -- the canary then tests
      # the pinned version and reports success, which is worse than having no
      # canary at all. Verified: after forcing mcp 2.1.1, `uv run` reported
      # 1.27.1; `uv run --no-sync` reported 2.1.1.
      - name: Report the resolved mcp version
        run: uv run --no-sync python -c "import importlib.metadata as m; print('mcp', m.version('mcp'))"

      - name: Test against unpinned mcp (informational)
        run: uv run --no-sync pytest -q
