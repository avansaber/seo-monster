name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Preserve the existing required check name.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install locked Python 3.11 environment
        run: |
          uv python install 3.11
          uv sync --locked --extra dev --python 3.11
      - name: Check source inventory and resolved dependencies
        run: |
          uv run --no-sync python scripts/check_distribution.py
          uv pip check
          uv run --no-sync python -c "import importlib.metadata as m; assert m.version('mcp') == '2.3.0'; print('mcp', m.version('mcp'))"
      - name: Lint and test engine
        run: |
          uv run --no-sync ruff check src/ tests/ scripts/
          uv run --no-sync pytest -q

  supported-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install Python 3.14 with newest supported SDK
        run: |
          uv python install 3.14
          uv sync --locked --extra dev --python 3.14
          uv pip install --upgrade --refresh 'mcp>=2.3.0,<3'
          uv pip check
      - name: Report actual SDK and test without resync
        run: |
          uv run --no-sync python -c "import importlib.metadata as m; print('mcp', m.version('mcp')); assert m.version('mcp').split('.')[0] == '2'"
          uv run --no-sync pytest -q

  # Latest ecosystem SDK is informational; it may still be the supported major.
  mcp-canary:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install engine and latest ecosystem SDK
        run: |
          uv python install 3.11
          uv sync --locked --extra dev --python 3.11
          uv pip install --upgrade --refresh mcp
      - name: Report actual ecosystem SDK and test without resync
        run: |
          uv run --no-sync python -c "import importlib.metadata as m; v=m.version('mcp'); print('mcp', v); print('Newer major probed:', int(v.split('.')[0]) > 2)"
          uv run --no-sync pytest -q

  companion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install engine and companion integration dependencies
        run: |
          uv python install 3.11
          uv sync --locked --extra dev --python 3.11
          uv pip install -e 'companion[mcp,test]'
          uv pip check
      - name: Validate independent companion lint
        run: |
          uv venv companion/.venv
          uv pip install --python companion/.venv/bin/python -e 'companion[dev]'
          companion/.venv/bin/ruff check --isolated companion/src companion/tests companion/scripts
      - name: Test engine and companion without environment resync
        run: |
          uv run --no-sync pytest -q tests companion/tests
          uv run --no-sync sm-workbench evaluate --fixtures companion/evaluation/fixtures
