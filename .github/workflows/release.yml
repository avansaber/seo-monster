name: Release

# Tag-driven release workflow. Pushing a tag of the form `v*` (e.g. v0.1.3)
# causes this workflow to:
#   1. Verify the tag's version matches pyproject.toml / __init__.py / manifest.json.
#   2. Run the offline test suite.
#   3. Build the wheel + sdist + .mcpb bundle.
#   4. Scan all three artifacts for credentials / PII / real local paths.
#   5. Attach the three artifacts to the corresponding GitHub release (creating
#      the release if it does not exist).
#   6. Publish the wheel + sdist to PyPI via Trusted Publishing (OIDC) when the
#      repo variable PYPI_PUBLISH_ENABLED is 'true' (active since v0.6.0).

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write     # create / update GitHub releases and upload assets
  id-token: write     # for PyPI Trusted Publishing (when enabled below)

env:
  # Force GitHub's pinned JS actions (checkout, setup-node, setup-uv,
  # action-gh-release) onto the runner's Node 24 ahead of the 2026-06-16 hard
  # cutover that removes the deprecated Node 20 runtime. Documented opt-in;
  # drop this once those actions default to Node 24 on their own.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive the bare version from the tag (strip leading 'v')
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Reject internal planning docs in tag tree
        run: |
          set -euo pipefail
          bad=$(git ls-tree -r --name-only HEAD | grep -E '^(RESEARCH-AND-PROPOSAL|LISTINGS-PLAN|PLAN)\.md$|^marketing/|^\.private/' || true)
          if [ -n "$bad" ]; then
            echo "::error::Internal planning docs found tracked at this tag:"
            echo "$bad"
            echo
            echo "Move them under ~/.local/share/seo-monster-private/ or a local .private/ directory and retag."
            exit 1
          fi
          echo "tag tree free of internal planning docs"

      - name: Verify version stamps match the tag
        # The tag name reaches this script through `env:` rather than a `${{ }}`
        # interpolation. Git accepts refnames containing `$( )` and backticks
        # (verified with `git check-ref-format`), so interpolating the tag
        # directly into a `run:` block would let a crafted tag execute arbitrary
        # commands in a job that holds `contents: write` and `id-token: write`.
        env:
          TAG_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          py=$(grep -E '^version' pyproject.toml | sed -E 's/.*"(.*)".*/\1/')
          init=$(grep -E '__version__' src/seo_mcp/__init__.py | sed -E 's/.*"(.*)".*/\1/')
          mf=$(python3 -c "import json; print(json.load(open('manifest.json'))['version'])")
          # server.json feeds the official MCP registry. It was not gated here,
          # which is how the registry entry drifted to v0.5.1 while PyPI was on
          # 0.9.2 (PLAN §11.4.1). Both of its version fields are checked.
          sj=$(python3 -c "import json; print(json.load(open('server.json'))['version'])")
          sjp=$(python3 -c "import json; d=json.load(open('server.json')); print(','.join(sorted({p['version'] for p in d.get('packages', [])})) or d['version'])")
          tag="$TAG_VERSION"
          echo "tag=$tag  pyproject=$py  __init__=$init  manifest=$mf  server.json=$sj  server.json/packages=$sjp"
          [ "$py" = "$tag" ] && [ "$init" = "$tag" ] && [ "$mf" = "$tag" ] && [ "$sj" = "$tag" ] && [ "$sjp" = "$tag" ] || {
            echo "version stamps disagree with the tag; refusing to release"
            exit 1
          }

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python 3.11 + project deps (dev extras for pytest)
        run: |
          uv python install 3.11
          uv venv
          uv pip install -e ".[dev]"

      - name: Run the offline test suite
        run: uv run pytest -q

      - name: Build wheel + sdist
        run: uv build

      - name: Set up Node 20 for the mcpb packer
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Pack the .mcpb bundle
        # Tag via env: for the same injection reason as the version gate.
        env:
          TAG_VERSION: ${{ steps.version.outputs.version }}
        run: |
          npx -y @anthropic-ai/mcpb@latest pack . \
            "dist/seo-monster-${TAG_VERSION}.mcpb"

      - name: Security scan (no credentials / PII / real local paths in any artifact)
        # Tag passed via `env:` for the same injection reason as above.
        env:
          TAG_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          v="$TAG_VERSION"
          for f in "dist/seo_monster-${v}-py3-none-any.whl" \
                   "dist/seo_monster-${v}.tar.gz" \
                   "dist/seo-monster-${v}.mcpb"; do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done
          tmp=$(mktemp -d)
          unzip -q "dist/seo_monster-${v}-py3-none-any.whl" -d "$tmp/wheel"
          tar xzf "dist/seo_monster-${v}.tar.gz" -C "$tmp/"
          unzip -q "dist/seo-monster-${v}.mcpb" -d "$tmp/mcpb"
          # Note: the PEM-header pattern uses [A-Z ]+ rather than .* so the
          # regex does not match a literal occurrence of itself inside this
          # workflow YAML when the sdist is included in the scan.
          if grep -rIE \
            'AIza[0-9A-Za-z_-]{35}|ya29\.[0-9A-Za-z_-]{20,}|1//0[0-9A-Za-z_-]{20,}|-----BEGIN [A-Z ]+PRIVATE KEY-----|Bearer [A-Za-z0-9_-]{30,}|pypi-AgE[A-Za-z0-9_-]{50,}|gho_[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}' \
            "$tmp" 2>/dev/null; then
            echo "LEAK: real credential pattern found in an artifact"
            exit 1
          fi
          # Round 6 §11b.ii companion fix: defense-in-depth against private
          # planning / submission staging leaking into any artifact, even if
          # .mcpbignore or sdist-exclude drift again in the future. CI is
          # already protected because git ls-tree never sees gitignored
          # files; this is the safety net for any artifact that bypassed
          # that path (e.g. if pyproject's sdist-exclude were ever removed).
          forbidden_paths=$(find "$tmp" \( \
            -path '*/.private/*' \
            -o -path '*/marketing/*' \
            -o -name 'PLAN.md' \
            -o -name 'RESEARCH-AND-PROPOSAL.md' \
            -o -name 'LISTINGS-PLAN.md' \
            -o -name 'EMAIL_DRAFT.md' \
            -o -name 'SUBMISSION_GUIDE.md' \
            \) 2>/dev/null)
          if [ -n "$forbidden_paths" ]; then
            echo "LEAK: private planning / submission paths found in an artifact:"
            echo "$forbidden_paths"
            exit 1
          fi
          echo "all three artifacts CLEAN (credentials + private paths)"

      - name: Upload artifacts to the GitHub release
        # Creates the release if it does not exist. Does not overwrite the
        # release body, so hand-crafted notes set via `gh release create` or
        # `gh release edit` survive. Use fail_on_unmatched_files so a missing
        # artifact aborts the workflow loudly.
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/seo_monster-${{ steps.version.outputs.version }}-py3-none-any.whl
            dist/seo_monster-${{ steps.version.outputs.version }}.tar.gz
            dist/seo-monster-${{ steps.version.outputs.version }}.mcpb
          fail_on_unmatched_files: true

      # --- PyPI Trusted Publishing (OIDC-based; no token needed) ---------
      #
      # This step is gated on the repo variable PYPI_PUBLISH_ENABLED so the
      # release job stays safe to push until the PyPI side is configured.
      # Activation sequence (one-time per repo):
      #
      # 1. Visit https://pypi.org/manage/project/seo-monster/settings/publishing/
      # 2. Add a trusted publisher with:
      #      owner:    avansaber
      #      repo:     seo-monster
      #      workflow: release.yml
      #      env:      (leave blank, or fill if you add an environment guard)
      # 3. Go to the GitHub repo > Settings > Secrets and variables >
      #    Actions > Variables, and add a new repo variable:
      #      name:  PYPI_PUBLISH_ENABLED
      #      value: true
      # 4. Push the next vN.N.N tag. This step fires; OIDC handles auth.
      #
      # While PYPI_PUBLISH_ENABLED is unset, the step is skipped and the
      # release pipeline behaves exactly as before (manual `uv publish`).
      # The `id-token: write` permission is already declared in this job's
      # `permissions:` block, so OIDC works at runtime when activated.
      - name: Keep only Python distributions in dist/ for PyPI
        if: ${{ vars.PYPI_PUBLISH_ENABLED == 'true' }}
        # PyPI accepts only sdists + wheels. The .mcpb bundle (and uv's
        # dist/.gitignore) must not reach twine, or it fails the upload with
        # "InvalidDistribution: Unknown distribution format". The .mcpb is
        # already attached to the GitHub release by the step above, so it is
        # safe to remove here. (Latent since v0.5.x; first surfaced when
        # PYPI_PUBLISH_ENABLED was turned on for v0.6.0.)
        run: |
          find dist -type f ! -name '*.whl' ! -name '*.tar.gz' -delete
          echo "dist/ now contains only Python distributions:"; ls -la dist/

      - name: Publish to PyPI (Trusted Publishing)
        if: ${{ vars.PYPI_PUBLISH_ENABLED == 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
