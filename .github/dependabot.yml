# Dependabot's job here is to surface routine dependency movement and to keep
# the repository active. It is NOT the detector for the failure that broke
# v0.9.2 -- see the `ignore` rules below, which deliberately suppress the mcp
# major bump. The mcp-canary job in ci.yml is what detects that class of break.
#
# Background: mcp 2.0.0 shipped on 2026-07-28 and removed the decorator
# registration API. Our dependency was declared `mcp>=1.0.0` with no ceiling,
# so every fresh resolve produced a server that could not start -- and CI never
# noticed, because it only runs on push and there were no pushes for 69 days.
#
# Where Dependabot genuinely helps: GitHub disables scheduled workflows after
# 60 days of repository inactivity, so without regular PR activity the ci.yml
# cron would switch itself off and the canary would stop running at all.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
    ignore:
      # Both of these majors are pinned deliberately, and a bump would undo a
      # fix rather than deliver one. Dependabot should still tell us about
      # minor/patch releases within the pinned range.
      #
      # mcp: 2.x removed the decorator registration API this server is built
      # on. Auto-relaxing the ceiling re-breaks every fresh install -- exactly
      # the v0.9.2 outage. Lift this together with the 2.x migration, not before.
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]
      # ruff: 0.16 reports 162 findings on the current tree, so a bump turns CI
      # red independently of any code change. Adopting it is its own PR.
      - dependency-name: "ruff"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
