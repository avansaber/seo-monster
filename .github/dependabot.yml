# Dependabot is the real control against the failure that broke v0.9.2.
#
# mcp 2.0.0 shipped on 2026-07-28 and removed the decorator registration API.
# Our dependency was declared `mcp>=1.0.0` with no ceiling, so every fresh
# resolve produced a server that could not start -- and CI never noticed,
# because it only runs on push and there were no pushes for 69 days.
#
# Opening PRs for dependency bumps fixes both halves of that: we see the major
# version arrive, and the repository stays active (GitHub disables scheduled
# workflows after 60 days of inactivity, which would otherwise switch off the
# cron in ci.yml).
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
    ignore:
      # Both of these majors are pinned deliberately, and a bump would undo a
      # fix rather than deliver one. Dependabot should still tell us about
      # minor/patch releases within the pinned range.
      #
      # mcp: 2.x removed the decorator registration API this server is built
      # on. Auto-relaxing the ceiling re-breaks every fresh install -- exactly
      # the v0.9.2 outage. Lift this together with the 2.x migration, not
      # before. See the internal migration plan.
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]
      # ruff: 0.16 reports 162 findings on the current tree, so a bump turns CI
      # red independently of any code change. Adopting it is its own PR.
      - dependency-name: "ruff"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
